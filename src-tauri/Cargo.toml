[package]
name = "hearthforge"
version = "0.1.0"
description = "Hearthforge: a lightweight addon manager and launcher for WoW Forever"
authors = ["Noolies"]
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "hearthforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
flate2 = "1.1.11"
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
keyring = "4.2.0"
log = "0.4.35"
pelite = { version = "0.10.0", default-features = false, features = ["mmap"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "json", "query", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["fs", "time", "sync", "macros", "rt-multi-thread"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-registry = "0.100.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
